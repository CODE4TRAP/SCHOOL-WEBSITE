  <rect y="210" width="400" height="90" fill="#4CAF50" />
  <!-- School Campus Building -->
  <polygon points="200,50 80,110 320,110" fill="#D32F2F" />
  <rect x="95" y="110" width="210" height="110" fill="#FFFDE7" />
  <rect x="175" y="150" width="50" height="70" rx="4" fill="#0C58A2" />
  <!-- Name on Building -->
  <rect x="110" y="115" width="180" height="24" rx="4" fill="#0C58A2" />
  <text x="200" y="132" font-family="'Poppins', sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">SWAMI SHIVANAND SCHOOL</text>
  <!-- Windows -->
  <rect x="115" y="145" width="35" height="30" rx="3" fill="#81D4FA" />
  <rect x="250" y="145" width="35" height="30" rx="3" fill="#81D4FA" />
  <!-- Trees -->
  <circle cx="50" cy="190" r="30" fill="#2E7D32" />
  <rect x="45" y="190" width="10" height="30" fill="#5D4037" />
  <circle cx="350" cy="190" r="30" fill="#2E7D32" />
  <rect x="345" y="190" width="10" height="30" fill="#5D4037" />
</svg>