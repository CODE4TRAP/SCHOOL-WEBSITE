<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="500" height="350">
  <defs>
    <linearGradient id="g_event6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B1FA2" />
      <stop offset="100%" stop-color="#4A148C" />
    </linearGradient>
    <filter id="shadow_event6" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="500" height="350" fill="url(#g_event6)" rx="16" />
  <rect x="16" y="16" width="468" height="318" rx="12" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-width="2" stroke-opacity="0.3"/>
  <circle cx="250" cy="140" r="65" fill="#ffffff" fill-opacity="0.18" filter="url(#shadow_event6)"/>
  <!-- Medal &amp; Certificate Icon -->
  <g transform="translate(250, 140)">
    <!-- Ribbons -->
    <polygon points="-16,-20 -28,10 -16,6" fill="#00E5FF"/>
    <polygon points="16,-20 28,10 16,6" fill="#00E5FF"/>
    <!-- Medal Circle -->
    <circle cx="0" cy="0" r="24" fill="#FFD700" stroke="#FFA000" stroke-width="3"/>
    <!-- Star on medal -->
    <path d="M 0,-10 L 3,-3 L 10,-3 L 5,2 L 7,9 L 0,5 L -7,9 L -5,2 L -10,-3 L -3,-3 Z" fill="#ffffff"/>
  </g>
  <rect x="30" y="245" width="440" height="58" rx="10" fill="#000000" fill-opacity="0.65" filter="url(#shadow_event6)"/>
  <text x="250" y="278" font-family="'Poppins', sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Annual Prize Distribution Ceremony</text>
  <text x="250" y="296" font-family="'Poppins', sans-serif" font-size="11" font-weight="500" fill="#E1BEE7" text-anchor="middle">Honoring Academic &amp; Creative Excellence</text>
</svg>