<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <linearGradient id="g8-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fdf4ff" />
      <stop offset="50%" stop-color="#fae8ff" />
      <stop offset="100%" stop-color="#f5d0fe" />
    </linearGradient>
    <linearGradient id="g8-slide" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <filter id="g8-shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="500" height="400" fill="url(#g8-bg)" />
  <!-- Colorful Foam Interlocking Floor Mats -->
  <rect x="0" y="320" width="125" height="80" fill="#60a5fa" />
  <rect x="125" y="320" width="125" height="80" fill="#34d399" />
  <rect x="250" y="320" width="125" height="80" fill="#f472b6" />
  <rect x="375" y="320" width="125" height="80" fill="#facc15" />
  <!-- Kids Playground Slide -->
  <!-- Ladder -->
  <line x1="80" y1="120" x2="60" y2="330" stroke="#0284c7" stroke-width="8" stroke-linecap="round" />
  <line x1="110" y1="120" x2="90" y2="330" stroke="#0284c7" stroke-width="8" stroke-linecap="round" />
  <line x1="75" y1="170" x2="105" y2="170" stroke="#38bdf8" stroke-width="6" />
  <line x1="70" y1="220" x2="100" y2="220" stroke="#38bdf8" stroke-width="6" />
  <line x1="65" y1="270" x2="95" y2="270" stroke="#38bdf8" stroke-width="6" />
  <!-- Slide Platform -->
  <rect x="75" y="105" width="60" height="18" rx="4" fill="#0369a1" />
  <!-- Slide Chute Curve -->
  <path d="M 115 115 Q 160 140 200 240 Q 220 300 280 320 L 290 328 L 240 328 Q 190 290 170 210 Q 140 140 100 125 Z" fill="url(#g8-slide)" filter="url(#g8-shadow)" />
  <!-- Building Blocks Castle -->
  <rect x="340" y="240" width="45" height="45" rx="6" fill="#3b82f6" filter="url(#g8-shadow)" />
  <text x="362" y="272" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">A</text>
  <rect x="395" y="240" width="45" height="45" rx="6" fill="#10b981" filter="url(#g8-shadow)" />
  <text x="417" y="272" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">B</text>
  <rect x="368" y="185" width="45" height="45" rx="6" fill="#ef4444" filter="url(#g8-shadow)" />
  <text x="390" y="217" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">C</text>
  <!-- Castle Roof Cone -->
  <polygon points="390,135 360,185 420,185" fill="#f59e0b" filter="url(#g8-shadow)" />
  <!-- Ball Pool Sphere Accents -->
  <circle cx="160" cy="305" r="14" fill="#ec4899" filter="url(#g8-shadow)" />
  <circle cx="185" cy="312" r="12" fill="#8b5cf6" filter="url(#g8-shadow)" />
  <circle cx="210" cy="300" r="13" fill="#06b6d4" filter="url(#g8-shadow)" />
  <circle cx="235" cy="310" r="11" fill="#eab308" filter="url(#g8-shadow)" />
  <!-- Cheerful Happy Sun Face in Sky -->
  <circle cx="430" cy="70" r="32" fill="#fde047" />
  <circle cx="420" cy="65" r="4" fill="#78350f" />
  <circle cx="440" cy="65" r="4" fill="#78350f" />
  <path d="M 422 76 Q 430 86 438 76" stroke="#78350f" stroke-width="3" fill="none" stroke-linecap="round" />
</svg>
