<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="t4-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d1fae5" />
      <stop offset="100%" stop-color="#a7f3d0" />
    </linearGradient>
    <linearGradient id="t4-attire" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#115e59" />
    </linearGradient>
    <clipPath id="circle-clip-t4">
      <circle cx="100" cy="100" r="95" />
    </clipPath>
  </defs>

  <!-- Circular Base -->
  <circle cx="100" cy="100" r="95" fill="url(#t4-bg)" />

  <g clip-path="url(#circle-clip-t4)">
    <!-- High Ponytail Hair Back -->
    <ellipse cx="140" cy="55" rx="16" ry="24" transform="rotate(25 140 55)" fill="#1e293b" />
    <circle cx="132" cy="62" r="5" fill="#f59e0b" /> <!-- Hairband -->

    <!-- Shoulders & Teal Modern Montessori Attire -->
    <path d="M 12 200 C 22 138 58 126 100 126 C 142 126 178 138 188 200 Z" fill="url(#t4-attire)" />

    <!-- Pastel Yellow Inner Top / Collar -->
    <polygon points="80,126 100,165 120,126" fill="#fef9c3" />
    <!-- Cheerful Activity Badge / Star Accent -->
    <polygon points="100,140 102,145 107,145 103,148 105,153 100,150 95,153 97,148 93,145 98,145" fill="#f59e0b" />

    <!-- Neck -->
    <rect x="88" y="106" width="24" height="24" fill="#fed7aa" rx="3" />

    <!-- Head / Face -->
    <circle cx="100" cy="78" r="38" fill="#ffedd5" />

    <!-- Playful Bright Eyes -->
    <circle cx="86" cy="74" r="3.5" fill="#1e293b" />
    <circle cx="114" cy="74" r="3.5" fill="#1e293b" />
    <circle cx="87.5" cy="72.5" r="1.2" fill="#ffffff" />
    <circle cx="115.5" cy="72.5" r="1.2" fill="#ffffff" />

    <!-- Lively Eyebrows -->
    <path d="M 79 64 Q 86 60 93 64" stroke="#334155" stroke-width="2.4" fill="none" stroke-linecap="round" />
    <path d="M 107 64 Q 114 60 121 64" stroke="#334155" stroke-width="2.4" fill="none" stroke-linecap="round" />

    <!-- Cheerful Peach Cheeks -->
    <circle cx="77" cy="86" r="5" fill="#f472b6" fill-opacity="0.5" />
    <circle cx="123" cy="86" r="5" fill="#f472b6" fill-opacity="0.5" />

    <!-- Energetic Montessori Smile -->
    <path d="M 89 91 Q 100 104 111 91" stroke="#e11d48" stroke-width="2.8" fill="none" stroke-linecap="round" />

    <!-- Modern Front Hair Frame (Side Fringe) -->
    <path d="M 62 80 C 60 45 80 37 100 37 C 122 37 138 46 138 78 C 128 54 108 48 95 52 C 82 50 68 58 62 80 Z" fill="#1e293b" />
    <path d="M 75 42 Q 105 45 130 65" stroke="#1e293b" stroke-width="6" fill="none" stroke-linecap="round" />

    <!-- Modern Teal Stud Earrings -->
    <circle cx="62" cy="80" r="3.5" fill="#0d9488" stroke="#ffffff" stroke-width="1" />
    <circle cx="138" cy="80" r="3.5" fill="#0d9488" stroke="#ffffff" stroke-width="1" />
  </g>

  <!-- Border Ring on Top -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#2dd4bf" stroke-width="4" />
</svg>