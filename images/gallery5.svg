<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <linearGradient id="g5-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="60%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#d9f99d" />
    </linearGradient>
    <linearGradient id="g5-tree" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <filter id="g5-shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="500" height="400" fill="url(#g5-sky)" />
  <!-- Gentle Green Hills -->
  <path d="M 0 310 Q 140 260 280 300 Q 400 330 500 290 L 500 400 L 0 400 Z" fill="#86efac" />
  <path d="M 0 330 Q 180 310 320 340 Q 420 360 500 330 L 500 400 L 0 400 Z" fill="#4ade80" />
  <path d="M 0 360 Q 220 340 500 360 L 500 400 L 0 400 Z" fill="#22c55e" />
  <!-- Radiant Sun -->
  <circle cx="90" cy="80" r="38" fill="#fef08a" fill-opacity="0.6" />
  <circle cx="90" cy="80" r="26" fill="#facc15" />
  <!-- Main Sprouting Tree -->
  <path d="M 235 370 Q 245 280 250 220 Q 255 280 265 370 Z" fill="#78350f" />
  <!-- Foliage Canopy -->
  <circle cx="250" cy="170" r="55" fill="url(#g5-tree)" filter="url(#g5-shadow)" />
  <circle cx="210" cy="180" r="45" fill="url(#g5-tree)" filter="url(#g5-shadow)" />
  <circle cx="290" cy="180" r="45" fill="url(#g5-tree)" filter="url(#g5-shadow)" />
  <circle cx="230" cy="130" r="42" fill="url(#g5-tree)" filter="url(#g5-shadow)" />
  <circle cx="270" cy="130" r="42" fill="url(#g5-tree)" filter="url(#g5-shadow)" />
  <!-- Green Leaves Accent -->
  <circle cx="250" cy="140" r="15" fill="#86efac" fill-opacity="0.8" />
  <circle cx="225" cy="170" r="12" fill="#86efac" fill-opacity="0.8" />
  <circle cx="275" cy="170" r="12" fill="#86efac" fill-opacity="0.8" />
  <!-- Kid with Watering Can -->
  <!-- Kid Silhouette on right -->
  <circle cx="390" cy="270" r="18" fill="#ffffff" filter="url(#g5-shadow)"/>
  <path d="M 375 295 L 395 345 L 370 370" stroke="#ffffff" stroke-width="9" stroke-linecap="round" fill="none" />
  <path d="M 395 345 L 415 370" stroke="#ffffff" stroke-width="9" stroke-linecap="round" fill="none" />
  <!-- Arm holding watering can -->
  <path d="M 380 300 L 340 310" stroke="#ffffff" stroke-width="8" stroke-linecap="round" fill="none" />
  <!-- Watering Can -->
  <path d="M 340 300 L 320 300 L 315 330 L 345 330 Z" fill="#0284c7" />
  <path d="M 315 315 L 290 325" stroke="#0284c7" stroke-width="5" stroke-linecap="round" fill="none" />
  <path d="M 345 305 Q 355 315 345 325" stroke="#0284c7" stroke-width="4" fill="none" />
  <!-- Water Droplets -->
  <circle cx="280" cy="335" r="3" fill="#38bdf8" />
  <circle cx="275" cy="345" r="3" fill="#38bdf8" />
  <circle cx="270" cy="355" r="3.5" fill="#38bdf8" />
  <!-- Butterflies -->
  <path d="M 140 160 Q 130 150 120 160 Q 130 170 140 160 Q 150 150 160 160 Q 150 170 140 160" fill="#f43f5e" />
  <path d="M 370 110 Q 360 100 350 110 Q 360 120 370 110 Q 380 100 390 110 Q 380 120 370 110" fill="#eab308" />
</svg>
