<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <linearGradient id="g9-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#042f2e" />
      <stop offset="60%" stop-color="#115e59" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="g9-liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="g9-glow">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#34d399" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="500" height="400" fill="url(#g9-bg)" />
  <!-- Lab Bench -->
  <rect x="0" y="310" width="500" height="90" fill="#134e4a" />
  <rect x="0" y="310" width="500" height="12" fill="#2dd4bf" />
  <!-- Microscope Instrument -->
  <!-- Base -->
  <rect x="220" y="280" width="90" height="25" rx="5" fill="#e2e8f0" filter="url(#g9-glow)" />
  <!-- Arm & Body -->
  <path d="M 290 280 L 290 200 Q 290 140 250 140 L 230 140" stroke="#cbd5e1" stroke-width="16" stroke-linecap="round" fill="none" />
  <!-- Eyepiece Tube -->
  <line x1="215" y1="110" x2="245" y2="160" stroke="#94a3b8" stroke-width="14" stroke-linecap="round" />
  <rect x="205" y="95" width="20" height="18" rx="3" fill="#64748b" transform="rotate(-30 215 104)" />
  <!-- Objective Lens -->
  <rect x="235" y="190" width="16" height="26" rx="3" fill="#64748b" />
  <!-- Stage Platform -->
  <rect x="200" y="225" width="65" height="10" rx="3" fill="#334155" />
  <!-- Glass Slide with Specimen -->
  <rect x="210" y="221" width="40" height="4" rx="1" fill="#38bdf8" />
  <circle cx="230" cy="223" r="2" fill="#ef4444" />
  <!-- Science Flask Beakers on Bench -->
  <!-- Erlenmeyer Flask Left -->
  <polygon points="120,200 135,200 155,275 100,275" fill="#f8fafc" fill-opacity="0.25" stroke="#f8fafc" stroke-width="3" filter="url(#g9-glow)" />
  <polygon points="106,250 149,250 154,274 101,274" fill="url(#g9-liquid)" />
  <!-- Flask Neck -->
  <rect x="122" y="180" width="11" height="22" fill="#f8fafc" fill-opacity="0.3" stroke="#f8fafc" stroke-width="2" />
  <!-- Bubbles floating up -->
  <circle cx="128" cy="235" r="4" fill="#ffffff" fill-opacity="0.8" />
  <circle cx="124" cy="215" r="3" fill="#ffffff" fill-opacity="0.8" />
  <circle cx="130" cy="195" r="2.5" fill="#ffffff" fill-opacity="0.8" />
  <!-- Beaker Right with Purple Chemical -->
  <rect x="360" y="220" width="55" height="65" rx="5" fill="#f8fafc" fill-opacity="0.25" stroke="#f8fafc" stroke-width="3" filter="url(#g9-glow)" />
  <rect x="362" y="245" width="51" height="38" rx="3" fill="#a855f7" />
  <circle cx="380" cy="255" r="3.5" fill="#fbcfe8" />
  <circle cx="395" cy="262" r="3" fill="#fbcfe8" />
  <!-- Atomic Ring Orbit Model in Air -->
  <ellipse cx="250" cy="70" rx="45" ry="16" fill="none" stroke="#2dd4bf" stroke-width="2.5" transform="rotate(30 250 70)" />
  <ellipse cx="250" cy="70" rx="45" ry="16" fill="none" stroke="#2dd4bf" stroke-width="2.5" transform="rotate(-30 250 70)" />
  <circle cx="250" cy="70" r="9" fill="#f59e0b" filter="url(#g9-glow)" />
  <!-- Glowing Stars of Curiosity -->
  <path d="M70 70 L72 76 L78 76 L73 80 L75 86 L70 82 L65 86 L67 80 L62 76 L68 76 Z" fill="#fde047"/>
  <path d="M420 80 L422 86 L428 86 L423 90 L425 96 L420 92 L415 96 L417 90 L412 86 L418 86 Z" fill="#67e8f9"/>
  <path d="M440 160 L441 165 L446 165 L442 168 L444 173 L440 170 L436 173 L438 168 L434 165 L439 165 Z" fill="#f472b6"/>
