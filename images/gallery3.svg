<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <linearGradient id="g3-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4c1d95" />
      <stop offset="60%" stop-color="#6d28d9" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <radialGradient id="spotlight" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="500" height="400" fill="url(#g3-bg)" />
  <!-- Spotlight Beam -->
  <polygon points="250,0 80,400 420,400" fill="url(#spotlight)" />
  <!-- Stage Wooden Floor -->
  <rect x="0" y="320" width="500" height="80" fill="#311042" />
  <rect x="0" y="320" width="500" height="10" fill="#4c1d95" />
  <!-- Musical Notes in Air -->
  <text x="80" y="100" font-size="38" fill="#fbbf24" filter="url(#glow)">♪</text>
  <text x="140" y="160" font-size="28" fill="#f472b6" filter="url(#glow)">♫</text>
  <text x="360" y="110" font-size="34" fill="#67e8f9" filter="url(#glow)">♬</text>
  <text x="410" y="170" font-size="28" fill="#fbbf24" filter="url(#glow)">♩</text>
  <!-- Classical Indian Tabla Pair -->
  <!-- Bayan (Bass drum) -->
  <ellipse cx="200" cy="300" rx="42" ry="24" fill="#cbd5e1" stroke="#334155" stroke-width="4" />
  <circle cx="200" cy="300" r="16" fill="#1e293b" />
  <path d="M 160 305 L 175 350 L 225 350 L 240 305 Z" fill="#94a3b8" />
  <!-- Dayan (Treble drum) -->
  <ellipse cx="290" cy="300" rx="36" ry="22" fill="#fed7aa" stroke="#78350f" stroke-width="4" />
  <circle cx="290" cy="300" r="14" fill="#1e293b" />
  <path d="M 256 305 L 268 350 L 312 350 L 324 305 Z" fill="#d97706" />
  <!-- Ghungroo / Bell strings -->
  <circle cx="120" cy="280" r="10" fill="#f59e0b" />
  <circle cx="105" cy="295" r="9" fill="#f59e0b" />
  <circle cx="125" cy="310" r="10" fill="#f59e0b" />
  <circle cx="110" cy="325" r="8" fill="#f59e0b" />
  <!-- Elegant Indian Dancer Silhouette in Center -->
  <circle cx="250" cy="115" r="20" fill="#fcd34d" filter="url(#glow)"/>
  <!-- Hair bun -->
  <circle cx="250" cy="94" r="10" fill="#fbbf24" />
  <!-- Dancer Bodice & Skirt Grace Pose -->
  <path d="M 235 140 Q 250 135 265 140 L 270 185 L 230 185 Z" fill="#fb7185" />
  <path d="M 230 185 Q 250 190 270 185 Q 320 250 290 260 Q 250 250 210 260 Q 180 250 230 185 Z" fill="#f43f5e" />
  <path d="M 235 145 Q 200 125 195 105" stroke="#fcd34d" stroke-width="7" stroke-linecap="round" fill="none" />
  <path d="M 265 145 Q 300 125 305 105" stroke="#fcd34d" stroke-width="7" stroke-linecap="round" fill="none" />
  <!-- Sparkles -->
  <polygon points="120,60 123,68 131,68 125,73 127,81 120,76 113,81 115,73 109,68 117,68" fill="#fef08a"/>
  <polygon points="380,60 383,68 391,68 385,73 387,81 380,76 373,81 375,73 369,68 377,68" fill="#fef08a"/>
</svg>
