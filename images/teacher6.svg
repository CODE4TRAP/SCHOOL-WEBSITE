<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="t6-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5" />
      <stop offset="100%" stop-color="#fed7aa" />
    </linearGradient>
    <linearGradient id="t6-jacket" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <clipPath id="circle-clip-t6">
      <circle cx="100" cy="100" r="95" />
    </clipPath>
  </defs>

  <!-- Circular Base -->
  <circle cx="100" cy="100" r="95" fill="url(#t6-bg)" />

  <g clip-path="url(#circle-clip-t6)">
    <!-- Broad Shoulders & Athletic Track Jacket -->
    <path d="M 10 200 C 20 136 56 124 100 124 C 144 124 180 136 190 200 Z" fill="url(#t6-jacket)" />

    <!-- White Athletic Stripe Accents on Shoulders -->
    <path d="M 22 200 C 28 152 50 138 72 130 L 76 138 C 56 146 36 160 30 200 Z" fill="#ffffff" />
    <path d="M 178 200 C 172 152 150 138 128 130 L 124 138 C 144 146 164 160 170 200 Z" fill="#ffffff" />

    <!-- White Sport Zip Collar -->
    <polygon points="82,124 100,162 118,124" fill="#ffffff" />
    <polygon points="88,124 100,150 112,124" fill="#fee2e2" />
    <!-- Zip Line -->
    <line x1="100" y1="150" x2="100" y2="185" stroke="#f1f5f9" stroke-width="3" />
    <rect x="98" y="152" width="4" height="6" fill="#64748b" rx="1" />

    <!-- Whistle Lanyard / Cord -->
    <path d="M 86 124 Q 100 168 100 175 Q 100 168 114 124" stroke="#0284c7" stroke-width="2.5" fill="none" />
    <!-- Silver Sports Whistle -->
    <circle cx="100" cy="178" r="5" fill="#94a3b8" />
    <rect x="98" y="174" width="9" height="5" fill="#cbd5e1" rx="1" />
    <circle cx="100" cy="178" r="2" fill="#475569" />

    <!-- Neck -->
    <rect x="88" y="104" width="24" height="24" fill="#fcd34d" rx="3" />

    <!-- Head / Face -->
    <circle cx="100" cy="76" r="38" fill="#fde68a" />

    <!-- Energetic Bright Eyes -->
    <circle cx="86" cy="73" r="3.5" fill="#1e293b" />
    <circle cx="114" cy="73" r="3.5" fill="#1e293b" />
    <circle cx="87.5" cy="71.5" r="1.2" fill="#ffffff" />
    <circle cx="115.5" cy="71.5" r="1.2" fill="#ffffff" />

    <!-- Athletic Confident Eyebrows -->
    <path d="M 78 62 Q 86 58 94 63" stroke="#1e293b" stroke-width="2.8" fill="none" stroke-linecap="round" />
    <path d="M 106 63 Q 114 58 122 62" stroke="#1e293b" stroke-width="2.8" fill="none" stroke-linecap="round" />

    <!-- Healthy Sun-kissed Cheeks -->
    <circle cx="78" cy="84" r="5" fill="#fca5a5" fill-opacity="0.5" />
    <circle cx="122" cy="84" r="5" fill="#fca5a5" fill-opacity="0.5" />

    <!-- Inspiring Coach Smile -->
    <path d="M 89 89 Q 100 100 111 89" stroke="#b91c1c" stroke-width="2.8" fill="none" stroke-linecap="round" />

    <!-- Short Athletic Hair (Crew cut / taper) -->
    <path d="M 62 72 C 58 42 74 34 100 34 C 124 34 140 42 138 72 C 134 50 116 42 100 44 C 84 42 66 50 62 72 Z" fill="#0f172a" />
    <!-- Short Textured Hair Top -->
    <path d="M 72 42 C 84 32 116 32 128 42 C 114 36 86 36 72 42 Z" fill="#1e293b" />
  </g>

  <!-- Border Ring on Top -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#f97316" stroke-width="4" />
</svg>