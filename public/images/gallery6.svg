<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <linearGradient id="g6-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="g6-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <radialGradient id="g6-spot" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <filter id="g6-glow">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#f59e0b" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="500" height="400" fill="url(#g6-bg)" />
  <circle cx="250" cy="220" r="180" fill="url(#g6-spot)" />
  <!-- Podium Platform -->
  <!-- 2nd Place (Silver) -->
  <rect x="90" y="270" width="100" height="130" rx="6" fill="#475569" stroke="#64748b" stroke-width="2" />
  <text x="140" y="330" font-size="36" font-weight="bold" fill="#e2e8f0" text-anchor="middle">2</text>
  <!-- 1st Place (Gold Center) -->
  <rect x="200" y="220" width="100" height="180" rx="6" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2" />
  <text x="250" y="290" font-size="42" font-weight="bold" fill="#fbbf24" text-anchor="middle">1</text>
  <!-- 3rd Place (Bronze) -->
  <rect x="310" y="300" width="100" height="100" rx="6" fill="#334155" stroke="#475569" stroke-width="2" />
  <text x="360" y="355" font-size="34" font-weight="bold" fill="#fed7aa" text-anchor="middle">3</text>
  <!-- Grand Winner Central Trophy -->
  <g filter="url(#g6-glow)">
    <!-- Cup Bowl -->
    <path d="M 215 100 L 285 100 L 275 160 Q 250 185 225 160 Z" fill="url(#g6-gold)" />
    <!-- Handles -->
    <path d="M 215 110 Q 185 125 220 150" stroke="#f59e0b" stroke-width="6" fill="none" stroke-linecap="round" />
    <path d="M 285 110 Q 315 125 280 150" stroke="#f59e0b" stroke-width="6" fill="none" stroke-linecap="round" />
    <!-- Stem & Base -->
    <rect x="244" y="175" width="12" height="24" fill="#d97706" />
    <polygon points="230,199 270,199 265,215 235,215" fill="url(#g6-gold)" />
    <!-- Star on Cup -->
    <path d="M250 120 L252 127 L259 127 L254 131 L256 138 L250 134 L244 138 L246 131 L241 127 L248 127 Z" fill="#ffffff" />
  </g>
  <!-- Laurel Wreath in Background -->
  <path d="M 175 140 Q 160 170 180 200" stroke="#fbbf24" stroke-width="4" stroke-dasharray="6,6" fill="none" />
  <path d="M 325 140 Q 340 170 320 200" stroke="#fbbf24" stroke-width="4" stroke-dasharray="6,6" fill="none" />
  <!-- Confetti Rain -->
  <rect x="80" y="40" width="8" height="16" rx="2" fill="#ef4444" transform="rotate(25 80 40)" />
  <rect x="140" y="80" width="8" height="16" rx="2" fill="#3b82f6" transform="rotate(-30 140 80)" />
  <rect x="360" y="50" width="8" height="16" rx="2" fill="#10b981" transform="rotate(40 360 50)" />
  <rect x="420" y="90" width="8" height="16" rx="2" fill="#f59e0b" transform="rotate(-20 420 90)" />
  <circle cx="200" cy="50" r="5" fill="#ec4899" />
  <circle cx="300" cy="40" r="5" fill="#a855f7" />
  <circle cx="250" cy="65" r="4" fill="#06b6d4" />
</svg>
