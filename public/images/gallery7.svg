<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <linearGradient id="g7-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="g7-screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="g7-glow">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#38bdf8" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="500" height="400" fill="url(#g7-bg)" />
  <!-- Classroom Floor -->
  <rect x="0" y="320" width="500" height="80" fill="#0f172a" />
  <rect x="0" y="320" width="500" height="8" fill="#38bdf8" fill-opacity="0.5" />
  <!-- Smart Digital Interactive Board in Center -->
  <rect x="70" y="40" width="360" height="230" rx="14" fill="#02142d" stroke="#64748b" stroke-width="6" filter="url(#g7-glow)" />
  <!-- Screen Display -->
  <rect x="80" y="50" width="340" height="210" rx="8" fill="url(#g7-screen)" />
  <!-- Interactive Educational Graphics on Screen -->
  <!-- ABC Alphabet Blocks -->
  <rect x="100" y="75" width="46" height="46" rx="8" fill="#ef4444" />
  <text x="123" y="108" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">A</text>
  <rect x="155" y="75" width="46" height="46" rx="8" fill="#f59e0b" />
  <text x="178" y="108" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">B</text>
  <rect x="210" y="75" width="46" height="46" rx="8" fill="#10b981" />
  <text x="233" y="108" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">C</text>
  <!-- 1 2 3 Math Numbers -->
  <rect x="100" y="135" width="46" height="46" rx="8" fill="#8b5cf6" />
  <text x="123" y="168" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <rect x="155" y="135" width="46" height="46" rx="8" fill="#ec4899" />
  <text x="178" y="168" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <rect x="210" y="135" width="46" height="46" rx="8" fill="#06b6d4" />
  <text x="233" y="168" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <!-- Solar System Planet on Screen -->
  <circle cx="340" cy="140" r="42" fill="#fbbf24" />
  <ellipse cx="340" cy="140" rx="60" ry="14" fill="none" stroke="#fef08a" stroke-width="4" transform="rotate(-20 340 140)" />
  <!-- Teacher Silhouette Pointing at Smart Board -->
  <circle cx="60" cy="230" r="18" fill="#ffffff" filter="url(#g7-glow)"/>
  <path d="M 45 255 L 70 340 L 40 340 Z" fill="#ffffff" />
  <path d="M 65 260 L 105 210 L 120 200" stroke="#ffffff" stroke-width="6" stroke-linecap="round" fill="none" />
  <!-- Students in Front Row Silhouette -->
  <circle cx="200" cy="330" r="16" fill="#ffffff" fill-opacity="0.9" />
  <path d="M 180 355 Q 200 345 220 355 L 225 400 L 175 400 Z" fill="#ffffff" fill-opacity="0.9" />
  <circle cx="280" cy="330" r="16" fill="#ffffff" fill-opacity="0.9" />
  <path d="M 260 355 Q 280 345 300 355 L 305 400 L 255 400 Z" fill="#ffffff" fill-opacity="0.9" />
  <circle cx="360" cy="330" r="16" fill="#ffffff" fill-opacity="0.9" />
  <path d="M 340 355 Q 360 345 380 355 L 385 400 L 335 400 Z" fill="#ffffff" fill-opacity="0.9" />
</svg>
