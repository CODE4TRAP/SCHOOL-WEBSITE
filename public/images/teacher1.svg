<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="t1-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
    <linearGradient id="t1-coat" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>
    <clipPath id="circle-clip-t1">
      <circle cx="100" cy="100" r="95" />
    </clipPath>
  </defs>

  <!-- Circular Base -->
  <circle cx="100" cy="100" r="95" fill="url(#t1-bg)" />

  <g clip-path="url(#circle-clip-t1)">
    <!-- Shoulders & Coat -->
    <path d="M 12 200 C 22 138 58 126 100 126 C 142 126 178 138 188 200 Z" fill="url(#t1-coat)" />
    
    <!-- White Inner Shirt / Saree Lapel -->
    <polygon points="78,126 100,165 122,126" fill="#ffffff" />
    <!-- Yellow Saree Border / Brooch Accent -->
    <polygon points="88,133 100,175 112,133" fill="#f59e0b" />
    <circle cx="100" cy="148" r="4" fill="#d97706" />

    <!-- Neck -->
    <rect x="88" y="106" width="24" height="24" fill="#fcd34d" rx="3" />

    <!-- Head / Face -->
    <circle cx="100" cy="78" r="38" fill="#fde68a" />

    <!-- Friendly Eyes -->
    <circle cx="86" cy="74" r="3.5" fill="#1e293b" />
    <circle cx="114" cy="74" r="3.5" fill="#1e293b" />
    <!-- Eye Sparkles -->
    <circle cx="87.5" cy="72.5" r="1.2" fill="#ffffff" />
    <circle cx="115.5" cy="72.5" r="1.2" fill="#ffffff" />

    <!-- Eyebrows -->
    <path d="M 79 65 Q 86 61 93 65" stroke="#334155" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <path d="M 107 65 Q 114 61 121 65" stroke="#334155" stroke-width="2.5" fill="none" stroke-linecap="round" />

    <!-- Soft Cheeks -->
    <circle cx="78" cy="85" r="5" fill="#fca5a5" fill-opacity="0.6" />
    <circle cx="122" cy="85" r="5" fill="#fca5a5" fill-opacity="0.6" />

    <!-- Warm Smiling Mouth -->
    <path d="M 90 91 Q 100 102 110 91" stroke="#e11d48" stroke-width="2.8" fill="none" stroke-linecap="round" />

    <!-- Bindi Accent -->
    <circle cx="100" cy="65" r="2.5" fill="#dc2626" />

    <!-- Hair (Elegant Bun & Parting) -->
    <!-- Back Hair Volume -->
    <ellipse cx="100" cy="46" rx="20" ry="12" fill="#1e293b" />
    <!-- Front Hair Frame -->
    <path d="M 62 82 C 60 48 80 40 100 40 C 120 40 140 48 138 82 C 128 55 110 50 100 52 C 90 50 72 55 62 82 Z" fill="#1e293b" />

    <!-- Pearl Earrings -->
    <circle cx="62" cy="82" r="3.5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <circle cx="138" cy="82" r="3.5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
  </g>

  <!-- Border Ring on Top -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#38bdf8" stroke-width="4" />
</svg>