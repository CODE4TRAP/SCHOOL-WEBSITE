<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" width="1600" height="600">
  <defs>
    <linearGradient id="bgGrad_slider4.svg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BF360C" />
      <stop offset="60%" stop-color="#072b4f" />
      <stop offset="100%" stop-color="#021426" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="600" fill="url(#bgGrad_slider4.svg)" />

  <!-- Playful Decorative Circles -->
  <circle cx="150" cy="80" r="160" fill="#ffffff" fill-opacity="0.04" />
  <circle cx="1450" cy="500" r="220" fill="#ffffff" fill-opacity="0.05" />
  <circle cx="800" cy="300" r="400" fill="#FFD700" fill-opacity="0.03" />

  <!-- Pattern / Visuals -->
  <g transform="translate(1050, 100)" filter="url(#cardShadow)">
    
<rect x="0" y="0" width="450" height="400" rx="24" fill="#ffffff" />
<rect x="15" y="15" width="420" height="260" rx="16" fill="#FFF3E0" />
<!-- Trophy and Medals -->
<path d="M 180,80 L 270,80 L 255,160 Q 225,190 225,200 L 225,220 L 195,220 L 195,200 Q 195,190 165,160 Z" fill="#FFA000" stroke="#FF6F00" stroke-width="3"/>
<rect x="180" y="220" width="90" height="20" rx="4" fill="#5D4037" />
<circle cx="225" cy="120" r="18" fill="#FFE082" />
<text x="225" y="126" font-family="'Poppins', sans-serif" font-size="18" font-weight="bold" fill="#E65100" text-anchor="middle">★</text>
<text x="225" y="320" font-family="'Poppins', sans-serif" font-size="20" font-weight="bold" fill="#E65100" text-anchor="middle">Sports &amp; Cultural Excellence</text>
<text x="225" y="350" font-family="'Poppins', sans-serif" font-size="15" fill="#666" text-anchor="middle">Holistic Physical, Social &amp; Emotional Development</text>

  </g>

  <!-- Left Content Box -->
  <g transform="translate(120, 140)">
    <!-- Badge -->
    <rect x="0" y="0" width="280" height="42" rx="21" fill="#FFB703" />
    <text x="140" y="27" font-family="'Poppins', sans-serif" font-size="16" font-weight="800" fill="#021426" text-anchor="middle" letter-spacing="1">
      ★ BEYOND ACADEMICS ★
    </text>

    <!-- Heading -->
    <text x="0" y="110" font-family="'Poppins', sans-serif" font-size="52" font-weight="900" fill="#ffffff">
      Holistic Child Development
    </text>

    <!-- Subtitle -->
    <text x="0" y="165" font-family="'Poppins', sans-serif" font-size="24" font-weight="400" fill="#e0eaff">
      Sports, Music, Dance, Yoga &amp; Cultural Activities All Year Round
    </text>

    <!-- Feature pills -->
    <g transform="translate(0, 210)">
      <rect x="0" y="0" width="190" height="40" rx="8" fill="#ffffff" fill-opacity="0.15" stroke="#ffffff" stroke-width="1.5" />
      <text x="95" y="25" font-family="'Poppins', sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">✓ Smart Classrooms</text>

      <rect x="205" y="0" width="190" height="40" rx="8" fill="#ffffff" fill-opacity="0.15" stroke="#ffffff" stroke-width="1.5" />
      <text x="300" y="25" font-family="'Poppins', sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">✓ Play &amp; Activity Zone</text>

      <rect x="410" y="0" width="190" height="40" rx="8" fill="#ffffff" fill-opacity="0.15" stroke="#ffffff" stroke-width="1.5" />
      <text x="505" y="25" font-family="'Poppins', sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">✓ Caring Faculty</text>
    </g>

    <!-- Action Buttons -->
    <g transform="translate(0, 280)">
      <rect x="0" y="0" width="220" height="54" rx="27" fill="#E63946" filter="url(#cardShadow)"/>
      <text x="110" y="34" font-family="'Poppins', sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Apply For Admission</text>

      <rect x="240" y="0" width="200" height="54" rx="27" fill="none" stroke="#ffffff" stroke-width="2.5" />
      <text x="340" y="34" font-family="'Poppins', sans-serif" font-size="18" font-weight="600" fill="#ffffff" text-anchor="middle">Explore Campus</text>
    </g>
  </g>
</svg>